name: CI

on: [push, pull_request]

# The Go module lives in sc-capture/, not at the repository root, so every job
# runs from there.
defaults:
  run:
    working-directory: sc-capture

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: sc-capture/go.sum
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      # The architecture tests are the enforcement mechanism for two
      # constitutional principles. Run them explicitly so a failure is
      # unmistakable in the log rather than buried in the suite.
      - name: Architecture rules (Principles II and VI)
        run: go test -v ./tests/architecture/...
      # Capture tests need CAP_NET_RAW and a live interface; they skip
      # themselves on a runner rather than failing, so this asserts the
      # offline suites really ran.
      - name: Protocol parity against the archived reference
        run: go test -v ./pkg/scproto/... -run Golden
      - name: Fault injection (constitution, Development Workflow)
        run: go test -v ./tests/faultinjection/...

  # Everything except live capture is platform-independent, so the offline
  # commands must build and their tests must pass on Windows without Npcap.
  # This is what keeps a Windows contributor able to verify, decode, index and
  # report coverage on an archived session with nothing extra installed.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: sc-capture/go.sum
      - name: Vet
        run: go vet ./...
      - name: Build (offline commands, no capture backend)
        env:
          CGO_ENABLED: '0'
        run: go build -o out/sccap.exe ./cmd/sccap
      - name: Platform-independent suites
        run: go test ./pkg/... ./internal/... ./tests/architecture/... ./tests/faultinjection/...

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ''
          - goos: linux
            goarch: arm64
            ext: ''
          - goos: windows
            goarch: amd64
            ext: '.exe'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: sc-capture/go.sum
      # CGO_ENABLED=0 is not incidental: a static binary with no runtime
      # prerequisites is the entire distribution story for non-expert
      # contributors (constitution, Additional Constraints). The Windows
      # artifact is therefore the offline build; a capture-capable Windows
      # binary needs Npcap and `-tags npcap`, which cannot be cross-compiled
      # and is not produced here.
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o out/sccap-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./cmd/sccap
      - uses: actions/upload-artifact@v4
        with:
          name: sccap-${{ matrix.goos }}-${{ matrix.goarch }}
          path: sc-capture/out/
