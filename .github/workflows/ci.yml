name: CI

on: [push, pull_request]

# The Go module lives in sc-capture/, not at the repository root, so every job
# runs from there.
defaults:
  run:
    working-directory: sc-capture

jobs:
  # The offline build: no cgo, no Npcap, no prerequisites. This is what a
  # contributor who only wants to read and analyse archived sessions installs,
  # and it is the configuration every test below runs against.
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: sc-capture/go.sum
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      # The architecture tests are the enforcement mechanism for two
      # constitutional principles. Run them explicitly so a failure is
      # unmistakable in the log rather than buried in the suite.
      - name: Architecture rules (Principles II and VI)
        run: go test -v ./tests/architecture/...
      - name: Protocol parity against the archived reference
        run: go test -v ./pkg/scproto/... -run Golden
      - name: Fault injection (constitution, Development Workflow)
        run: go test -v ./tests/faultinjection/...

  # The capture backend is the one file cgo compiles and the only one a runner
  # cannot exercise: capture needs Npcap installed, elevation and a live
  # interface, so tests/e2e skips here no matter what. Compiling it is
  # therefore the only protection it gets, and it needs that protection —
  # source_npcap.go is where an API mistake would sit undetected until a
  # contributor tried to record a session that no longer exists.
  #
  # The SDK provides only headers and an import library; the Npcap runtime
  # itself is not installed and is not needed to compile.
  capture-backend:
    runs-on: windows-latest
    env:
      NPCAP_SDK_VERSION: '1.13'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: sc-capture/go.sum
      - name: Fetch the Npcap SDK
        shell: pwsh
        run: |
          $url = "https://npcap.com/dist/npcap-sdk-$env:NPCAP_SDK_VERSION.zip"
          $zip = Join-Path $env:RUNNER_TEMP 'npcap-sdk.zip'
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'npcap-sdk')
      - name: Build with the capture backend
        shell: pwsh
        env:
          CGO_ENABLED: '1'
        run: |
          $sdk = Join-Path $env:RUNNER_TEMP 'npcap-sdk'
          $env:CGO_CFLAGS = "-I$sdk\Include"
          $env:CGO_LDFLAGS = "-L$sdk\Lib\x64"
          go build -tags npcap -o out\sccap-npcap.exe .\cmd\sccap
      - name: Vet the capture backend
        shell: pwsh
        env:
          CGO_ENABLED: '1'
        run: |
          $sdk = Join-Path $env:RUNNER_TEMP 'npcap-sdk'
          $env:CGO_CFLAGS = "-I$sdk\Include"
          $env:CGO_LDFLAGS = "-L$sdk\Lib\x64"
          go vet -tags npcap ./...

  build:
    runs-on: windows-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: sc-capture/go.sum
      # CGO_ENABLED=0 is not incidental: a static binary with no runtime
      # prerequisites is the entire distribution story for non-expert
      # contributors (constitution, Additional Constraints). The published
      # artifact is therefore the offline build. A capture-capable binary needs
      # Npcap and `-tags npcap`, which cannot be cross-compiled and whose
      # licence forbids redistributing the dependency anyway, so it is built
      # above but never shipped from here.
      - name: Build windows/${{ matrix.goarch }}
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
        run: go build -o out/sccap-windows-${{ matrix.goarch }}.exe ./cmd/sccap
      - uses: actions/upload-artifact@v4
        with:
          name: sccap-windows-${{ matrix.goarch }}
          path: sc-capture/out/
